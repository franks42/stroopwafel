name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [jvm, babashka]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
          bb: 1.13.230

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Tests (JVM)
        if: matrix.runtime == 'jvm'
        run: clojure -X:test

      - name: Tests (babashka)
        if: matrix.runtime == 'babashka'
        run: bb test:bb

      - name: Build JAR
        if: matrix.runtime == 'jvm'
        run: clojure -T:build jar
